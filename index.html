<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>吴建成 &amp; 卢晴 婚礼邀请函</title>
    <meta name="description" content="诚邀您见证我们的婚礼 · 2026年10月6日 11:18">

    <meta itemprop="name" content="吴建成 &amp; 卢晴 婚礼邀请函">
    <meta itemprop="description" content="诚邀您见证我们的婚礼 · 2026年10月6日 11:18">
    <meta itemprop="image" content="https://www.lq520.top/share-cover.jpg">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="吴建成 &amp; 卢晴 Wedding">
    <meta property="og:title" content="吴建成 &amp; 卢晴 婚礼邀请函">
    <meta property="og:description" content="诚邀您见证我们的婚礼 · 2026年10月6日 11:18">
    <meta property="og:url" content="https://www.lq520.top/">
    <meta property="og:image" content="https://www.lq520.top/share-cover.jpg">
    <meta property="og:image:width" content="1500">
    <meta property="og:image:height" content="1000">
    <meta property="og:image:alt" content="吴建成与卢晴的婚礼邀请封面">
  </head>
  <body>
    <div class="site-loader" id="site-loader" role="status" aria-label="页面加载中">
      <div class="loader-wash"></div>
      <div class="loader-spinner">
        <span class="loader-frame loader-frame-a"></span>
        <span class="loader-frame loader-frame-b"></span>
        <span class="loader-core"></span>
        <span class="loader-monogram">吴 &amp; 卢</span>
        <span class="loader-word">LOADING</span>
      </div>
    </div>

    <main class="swiper wedding-swiper">
      <div class="swiper-wrapper">
        <section class="swiper-slide cover-slide">
          <div class="cover-bg" data-swiper-parallax="-24%" data-photo-id="cover"></div>
          <div class="cover-vignette"></div>
          <div class="cover-content" data-swiper-parallax="-180">
            <p class="eyebrow">Wedding Invitation</p>
            <h1 class="couple-names">吴建成 &amp; 卢晴</h1>
            <div class="typed-line">
              <span id="typed-cover"></span>
            </div>
            <p class="date">2026.10.06</p>
          </div>
          <button class="scroll-hint" type="button" aria-label="向下翻页">
            <span></span>
          </button>
        </section>

        <section class="swiper-slide story-slide layout-01">
          <div class="slide-bg"></div>
          <div class="content-grid">
            <figure class="photo-stack" data-swiper-parallax="-120">
              <picture data-photo-id="story-01">
                <source media="(max-width: 760px)" srcset="/src/assets/M2.webp">
                <img src="/src/assets/PC2.webp" alt="新人的照片">
              </picture>
              <figcaption>Our Story</figcaption>
            </figure>
            <article class="copy-block" data-swiper-parallax="-260">
              <p class="section-index">01</p>
              <h2>初见</h2>
              <p id="typed-story"></p>
            </article>
          </div>
        </section>

        <section class="swiper-slide gallery-slide layout-02">
          <div class="slide-bg light-bg"></div>
          <div class="gallery-layout">
            <article class="copy-block" data-swiper-parallax="-220">
              <p class="section-index">02</p>
              <h2>同行</h2>
              <p id="typed-gallery"></p>
            </article>
            <div class="photo-collage" data-swiper-parallax="-120">
              <picture class="photo-main" data-photo-id="gallery-02-main">
                <source media="(max-width: 760px)" srcset="/src/assets/M3上.webp">
                <img src="/src/assets/PC3大.webp" alt="婚礼照片">
              </picture>
              <picture class="photo-side" data-photo-id="gallery-02-side">
                <source media="(max-width: 760px)" srcset="/src/assets/M3下.webp">
                <img src="/src/assets/PC3小.webp" alt="婚礼照片">
              </picture>
            </div>
          </div>
        </section>

        <section class="swiper-slide story-slide memory-slide layout-03">
          <div class="slide-bg"></div>
          <div class="content-grid">
            <figure class="photo-stack" data-swiper-parallax="-120">
              <picture data-photo-id="story-03">
                <source media="(max-width: 760px)" srcset="/src/assets/M4.webp">
                <img src="/src/assets/PC4.webp" alt="我们的婚礼照片">
              </picture>
              <figcaption>Knowing You</figcaption>
            </figure>
            <article class="copy-block" data-swiper-parallax="-260">
              <p class="section-index">03</p>
              <h2>相知</h2>
              <p id="typed-knowing"></p>
            </article>
          </div>
        </section>

        <section class="swiper-slide gallery-slide memory-slide layout-04">
          <div class="slide-bg light-bg"></div>
          <div class="gallery-layout">
            <article class="copy-block" data-swiper-parallax="-220">
              <p class="section-index">04</p>
              <h2>相伴</h2>
              <p id="typed-together"></p>
            </article>
            <div class="photo-collage" data-swiper-parallax="-120">
              <picture class="photo-main" data-photo-id="gallery-04-main">
                <source media="(max-width: 760px)" srcset="/src/assets/M5上.webp">
                <img src="/src/assets/PC5大.webp" alt="我们的婚礼照片">
              </picture>
              <picture class="photo-side" data-photo-id="gallery-04-side">
                <source media="(max-width: 760px)" srcset="/src/assets/M5下.webp">
                <img src="/src/assets/PC5小.webp" alt="我们的婚礼照片">
              </picture>
            </div>
          </div>
        </section>

        <section class="swiper-slide story-slide memory-slide layout-05">
          <div class="slide-bg"></div>
          <div class="content-grid">
            <figure class="photo-stack" data-swiper-parallax="-120">
              <picture data-photo-id="story-05">
                <source media="(max-width: 760px)" srcset="/src/assets/M6.webp">
                <img src="/src/assets/PC6.webp" alt="我们的婚礼照片">
              </picture>
              <figcaption>Forever</figcaption>
            </figure>
            <article class="copy-block" data-swiper-parallax="-260">
              <p class="section-index">05</p>
              <h2>此刻</h2>
              <p id="typed-moment"></p>
            </article>
          </div>
        </section>

        <section class="swiper-slide details-slide">
          <div class="details-bg"></div>
          <div class="details-content" data-swiper-parallax="-220">
            <p class="eyebrow">Save The Date</p>
            <h2>诚邀您见证我们的婚礼</h2>
            <div class="detail-list">
              <p><span>时间</span>2026 年 10 月 6 日 11:18</p>
              <p class="venue-detail">
                <span>地点</span>
                <a class="venue-address" href="https://ditu.amap.com/place/B0FFF00J7A" aria-label="打开高德地图导航到四川省乐山市金水湾.花园酒店">金水湾.花园酒店 四川省乐山市市中区棉竹镇金水湾路889号<span class="map-icon" aria-hidden="true">↗</span></a>
              </p>
              <p><span>新人</span>吴建成 &amp; 卢晴</p>
            </div>
            <form class="rsvp-form" data-api-url="/submitRsvp" novalidate>
              <label>
                <span>姓名</span>
                <input name="name" type="text" autocomplete="name" placeholder="请输入您的姓名" required>
              </label>
              <label>
                <span>电话</span>
                <input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="请输入联系电话" required>
              </label>
              <label>
                <span>出席人数</span>
                <input name="guestCount" type="number" inputmode="numeric" min="1" max="20" step="1">
              </label>
              <button type="submit">提交回执</button>
              <p class="rsvp-message" aria-live="polite"></p>
            </form>
            <footer class="icp-footer">
              <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">蜀ICP备2026039459号</a>
            </footer>
          </div>
        </section>
      </div>
      <div class="swiper-pagination"></div>
    </main>

    <div class="petal-layer" aria-hidden="true"></div>

    <aside class="music-widget">
      <button class="music-toggle" type="button" aria-label="打开背景音乐" aria-expanded="false" aria-controls="music-panel">
        <span class="music-preview">
          <img src="/src/assets/PC1.webp" alt="">
          <span class="music-play-icon" aria-hidden="true"></span>
        </span>
        <span class="music-tab" aria-hidden="true"></span>
      </button>
      <div class="music-panel" id="music-panel" hidden>
        <button class="music-close" type="button" aria-label="收起背景音乐"></button>
        <div class="music-panel-head">
          <span>Till I Die</span>
          <small>TheBluelee</small>
        </div>
        <audio class="music-audio" controls autoplay loop preload="auto"></audio>
      </div>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
